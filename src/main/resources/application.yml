server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

spring:
  application:
    name: qr-ordering-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qr_ordering?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:your-db-password}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

wechat:
  appid: wx76c9ed9fd79a7c4d
  secret: ${WECHAT_SECRET:your-wechat-secret}

logging:
  level:
    com.ordering: debug

# 飞书多维表格配置
feishu:
  app-id: ${FEISHU_APP_ID:your-feishu-app-id}
  app-secret: ${FEISHU_APP_SECRET:your-feishu-app-secret}
  base-token: your-feishu-base-token

# AI 功能配置（豆包大模型）
ai:
  # 总开关：false 时 AI 接口直接返回"未开启"
  enabled: true
  # 火山引擎控制台申请的 API Key
  api-key: ${AI_API_KEY:your-ai-api-key}
  # 对话模型接入点 ID
  model: your-chat-model-endpoint
  # Embedding模型接入点 ID（RAG向量检索用）
  embedding-model: your-embedding-model-endpoint
